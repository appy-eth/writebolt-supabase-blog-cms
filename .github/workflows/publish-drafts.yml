name: Publish scheduled articles

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check if scheduling is enabled
        id: check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SETTINGS=$(curl -sS \
            "${SUPABASE_URL}/rest/v1/site_settings?select=scheduled_publishing_enabled&limit=1" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}")

          ENABLED=$(echo "$SETTINGS" | python3 -c "import sys,json; data=json.loads(sys.stdin.read() or '[]'); print(data[0].get('scheduled_publishing_enabled', True) if data else True)")

          if [ "$ENABLED" = "False" ] || [ "$ENABLED" = "false" ]; then
            echo "Scheduled publishing is disabled in site_settings. Exiting."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish due articles
        if: steps.check.outputs.skip != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          NOW=$(date -u +%Y-%m-%dT%H%%3A%M%%3A%SZ)
          NOW_PLAIN=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          RESPONSE=$(curl -sS -X PATCH \
            "${SUPABASE_URL}/rest/v1/articles?status=eq.scheduled&scheduled_for=lte.${NOW}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d "{\"status\": \"published\", \"published_at\": \"${NOW_PLAIN}\", \"scheduled_for\": null}")

          COUNT=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.loads(sys.stdin.read() or '[]'); print(len(d) if isinstance(d, list) else 0)" 2>/dev/null || echo "0")
          echo "Published ${COUNT} scheduled article(s)"
